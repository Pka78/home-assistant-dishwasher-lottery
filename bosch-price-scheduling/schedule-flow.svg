<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Price-optimized dishwasher schedule</title><desc id="desc">Choose a programme and finish deadline, find the lowest consecutive quarter-hour price window, send the delayed-start command immediately to the dishwasher, and let the appliance count down and start itself.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#49627a" stroke-width="2"/></marker><style>.bg{fill:#f5f8fc}.box{fill:#fff;stroke:#b7c8d8;stroke-width:2;rx:18}.blue{fill:#e9f5ff;stroke:#5a9bd5;stroke-width:2;rx:18}.green{fill:#e8f6ee;stroke:#62a77b;stroke-width:2;rx:18}.gold{fill:#fff4d6;stroke:#d0a83b;stroke-width:2;rx:18}.title{font:700 27px system-ui,sans-serif;fill:#17324d}.label{font:600 19px system-ui,sans-serif;fill:#203a52}.small{font:16px system-ui,sans-serif;fill:#52677a}.arrow{fill:none;stroke:#49627a;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect class="bg" width="1200" height="570" rx="24"/><text class="title" x="600" y="52" text-anchor="middle">Price-optimized dishwasher scheduling</text><rect class="blue" x="55" y="115" width="235" height="135"/><text class="label" x="172" y="160" text-anchor="middle">Choose programme</text><text class="small" x="172" y="191" text-anchor="middle">Eco or Auto</text><text class="small" x="172" y="216" text-anchor="middle">Set finish deadline</text><path class="arrow" d="M290 183h50"/><rect class="box" x="350" y="115" width="245" height="135"/><text class="label" x="472" y="160" text-anchor="middle">Search prices</text><text class="small" x="472" y="191" text-anchor="middle">Lowest contiguous</text><text class="small" x="472" y="216" text-anchor="middle">15-minute window</text><path class="arrow" d="M595 183h50"/><rect class="green" x="655" y="115" width="245" height="135"/><text class="label" x="777" y="160" text-anchor="middle">Send delay now</text><text class="small" x="777" y="191" text-anchor="middle">Home Connect</text><text class="small" x="777" y="216" text-anchor="middle">StartInRelative</text><path class="arrow" d="M900 183h50"/><rect class="gold" x="960" y="115" width="190" height="135"/><text class="label" x="1055" y="160" text-anchor="middle">Appliance</text><text class="small" x="1055" y="191" text-anchor="middle">counts down</text><text class="small" x="1055" y="216" text-anchor="middle">and starts itself</text><rect class="box" x="120" y="330" width="430" height="150"/><text class="label" x="335" y="375" text-anchor="middle">Checks before scheduling</text><text class="small" x="335" y="407" text-anchor="middle">Connected · ready · door closed</text><text class="small" x="335" y="434" text-anchor="middle">Remote start enabled · programme selected</text><text class="small" x="335" y="461" text-anchor="middle">Complete, contiguous price data</text><rect class="box" x="650" y="330" width="430" height="150"/><text class="label" x="865" y="375" text-anchor="middle">Safe cancellation</text><text class="small" x="865" y="407" text-anchor="middle">Cancel a pending delay only</text><text class="small" x="865" y="434" text-anchor="middle">Never stop a wash already running</text><text class="small" x="865" y="461" text-anchor="middle">No automatic retry after an error</text></svg>