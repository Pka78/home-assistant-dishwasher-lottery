- id: dishwasher_lottery_reset_on_new_cycle
  alias: Dishwasher lottery – reset cycle guard
  description: Reset the per-cycle distribution guard, charge marker, and previous assignment when a new cycle starts.
  triggers:
    - trigger: state
      entity_id: sensor.dishwasher_operation_state
      to: run
  conditions: []
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.dishwasher_lottery_tickets_distributed
    - action: input_select.select_option
      target:
        entity_id: input_select.dishwasher_lottery_charge
      data:
        option: No ticket charged
    - action: input_select.select_option
      target:
        entity_id: input_select.dishwasher_unload_turn
      data:
        option: Select a person
  mode: single
  initial_state: true

- id: dishwasher_lottery_draw_on_completion
  alias: Dishwasher lottery – draw on cycle completion
  description: At confirmed completion, each member at home receives one ticket and a weighted draw selects the assigned emptier; no ticket is charged yet.
  triggers:
    - trigger: state
      entity_id: sensor.dishwasher_program_finished
      to: present
    - trigger: state
      entity_id: sensor.dishwasher_operation_state
      to: finished
    - trigger: state
      entity_id:
        - person.household_member_1
        - person.household_member_2
        - person.household_member_3
        - person.household_member_4
      to: home
  conditions:
    - condition: state
      entity_id: sensor.dishwasher_program_finished
      state: present
    - condition: state
      entity_id: sensor.dishwasher_operation_state
      state: finished
    - condition: state
      entity_id: binary_sensor.dishwasher_program_aborted
      state: 'off'
    - condition: template
      value_template: "{{ states('sensor.dishwasher_door') in ['closed','locked'] }}"
  actions:
    - delay:
        seconds: 5
    - condition: state
      entity_id: sensor.dishwasher_program_finished
      state: present
    - condition: state
      entity_id: sensor.dishwasher_operation_state
      state: finished
    - condition: state
      entity_id: binary_sensor.dishwasher_program_aborted
      state: 'off'
    - condition: template
      value_template: "{{ states('sensor.dishwasher_door') in ['closed','locked'] }}"
    - action: script.dishwasher_lottery_draw
  mode: single
  initial_state: true

- id: dishwasher_lottery_charge_on_confirmation
  alias: Dishwasher lottery – charge selected emptier on confirmation
  description: Charge one ticket from the selected actual emptier only when the explicit empty-confirmation button is pressed; at most once per cycle.
  triggers:
    - trigger: state
      entity_id: input_button.dishwasher_unload_confirmed
  conditions: []
  actions:
    - variables:
        selected: "{{ states('input_select.dishwasher_unload_turn') }}"
        charged: "{{ states('input_select.dishwasher_lottery_charge') }}"
    - if:
        - condition: template
          value_template: >-
            {{ selected in ['Member 1','Member 2','Member 3','Member 4']
               and charged == 'No ticket charged'
               and is_state('input_boolean.dishwasher_lottery_tickets_distributed','on') }}
      then:
        - choose:
            - conditions: "{{ selected == 'Member 1' }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.dishwasher_lottery_tickets_member_1
                  data:
                    value: "{{ [states('input_number.dishwasher_lottery_tickets_member_1')|int(0) - 1,0]|max }}"
            - conditions: "{{ selected == 'Member 2' }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.dishwasher_lottery_tickets_member_2
                  data:
                    value: "{{ [states('input_number.dishwasher_lottery_tickets_member_2')|int(0) - 1,0]|max }}"
            - conditions: "{{ selected == 'Member 3' }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.dishwasher_lottery_tickets_member_3
                  data:
                    value: "{{ [states('input_number.dishwasher_lottery_tickets_member_3')|int(0) - 1,0]|max }}"
            - conditions: "{{ selected == 'Member 4' }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.dishwasher_lottery_tickets_member_4
                  data:
                    value: "{{ [states('input_number.dishwasher_lottery_tickets_member_4')|int(0) - 1,0]|max }}"
        - action: input_select.select_option
          target:
            entity_id: input_select.dishwasher_lottery_charge
          data:
            option: "{{ selected }}"
        - action: input_select.select_option
          target:
            entity_id: input_select.dishwasher_unload_turn
          data:
            option: Select a person
  mode: single
  initial_state: true

- id: dishwasher_lottery_monthly_balance_normalization
  alias: Dishwasher lottery – normalize ticket balances monthly
  description: On the first day of each month at 00:01, subtract the shared minimum from all four valid ticket counters. Invalid or out-of-range values cause no changes.
  triggers:
    - trigger: time
      at: "00:01:00"
  conditions:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  actions:
    - variables:
        minimum: >-
          {% set raw = [
            states('input_number.dishwasher_lottery_tickets_member_1'),
            states('input_number.dishwasher_lottery_tickets_member_2'),
            states('input_number.dishwasher_lottery_tickets_member_3'),
            states('input_number.dishwasher_lottery_tickets_member_4')
          ] %}
          {% set ns = namespace(valid=true) %}
          {% for value in raw %}
            {% if not is_number(value) or value|float < 0 or value|float > 100 %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
          {% if ns.valid %}{{ (raw|map('float')|map('int')|list)|min }}{% else %}-1{% endif %}
    - if:
        - condition: template
          value_template: "{{ minimum|int(-1) > 0 }}"
      then:
        - repeat:
            for_each:
              - input_number.dishwasher_lottery_tickets_member_1
              - input_number.dishwasher_lottery_tickets_member_2
              - input_number.dishwasher_lottery_tickets_member_3
              - input_number.dishwasher_lottery_tickets_member_4
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  value: "{{ [states(repeat.item)|float(-1)|int - minimum|int(-1),0]|max }}"
  mode: single
  initial_state: true
