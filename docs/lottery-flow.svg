<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Dishwasher duty lottery flow</title><desc id="desc">A confirmed completed dishwasher cycle awards one ticket to each member at home. A weighted draw or manual choice selects who unloads, and the selected member spends one ticket.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#49627a" stroke-width="2"/></marker><style>.bg{fill:#f5f8fc}.box{fill:#fff;stroke:#b7c8d8;stroke-width:2;rx:18}.accent{fill:#e9f5ff;stroke:#5a9bd5;stroke-width:2;rx:18}.green{fill:#e8f6ee;stroke:#62a77b;stroke-width:2;rx:18}.gold{fill:#fff4d6;stroke:#d0a83b;stroke-width:2;rx:18}.title{font:700 27px system-ui,sans-serif;fill:#17324d}.label{font:600 20px system-ui,sans-serif;fill:#203a52}.small{font:16px system-ui,sans-serif;fill:#52677a}.arrow{fill:none;stroke:#49627a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect class="bg" width="1200" height="770" rx="24"/><text class="title" x="600" y="55" text-anchor="middle">How the unloading turn is chosen</text>
<rect class="accent" x="370" y="95" width="460" height="90"/><text class="label" x="600" y="133" text-anchor="middle">Cycle completion confirmed</text><text class="small" x="600" y="160" text-anchor="middle">Completion and closed door are checked again</text>
<path class="arrow" d="M600 185v42"/><rect class="box" x="370" y="230" width="460" height="100"/><text class="label" x="600" y="270" text-anchor="middle">Check who is home</text><text class="small" x="600" y="299" text-anchor="middle">Only currently eligible members participate</text>
<path class="arrow" d="M600 330v42"/><rect class="green" x="370" y="375" width="460" height="100"/><text class="label" x="600" y="415" text-anchor="middle">Give each eligible member one ticket</text><text class="small" x="600" y="444" text-anchor="middle">At most once for this wash cycle</text>
<path class="arrow" d="M600 475v40"/><rect class="gold" x="90" y="520" width="450" height="110"/><text class="label" x="315" y="562" text-anchor="middle">Weighted random draw</text><text class="small" x="315" y="592" text-anchor="middle">More tickets mean higher odds</text>
<rect class="accent" x="660" y="520" width="450" height="110"/><text class="label" x="885" y="562" text-anchor="middle">Manual choice</text><text class="small" x="885" y="592" text-anchor="middle">An explicit selection overrides the draw</text>
<path class="arrow" d="M540 575h115"/><path class="arrow" d="M885 630v46H600v32"/><path class="arrow" d="M315 630v46h285"/>
<rect class="box" x="370" y="680" width="460" height="70"/><text class="label" x="600" y="710" text-anchor="middle">Selected member spends one ticket</text><text class="small" x="600" y="735" text-anchor="middle">The next cycle starts with a fresh eligibility check</text>
</svg>