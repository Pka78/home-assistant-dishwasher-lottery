<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Monthly ticket balance normalization</title><desc id="desc">On the first day of each month at 00:01, if all four balances are valid, subtract the smallest balance from every member. Relative differences are preserved. If the minimum is zero, no change is needed.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#49627a" stroke-width="2"/></marker><style>.bg{fill:#f5f8fc}.box{fill:#fff;stroke:#b7c8d8;stroke-width:2;rx:18}.blue{fill:#e9f5ff;stroke:#5a9bd5;stroke-width:2;rx:18}.green{fill:#e8f6ee;stroke:#62a77b;stroke-width:2;rx:18}.amber{fill:#fff4d6;stroke:#d0a83b;stroke-width:2;rx:18}.title{font:700 27px system-ui,sans-serif;fill:#17324d}.label{font:600 20px system-ui,sans-serif;fill:#203a52}.small{font:16px system-ui,sans-serif;fill:#52677a}.arrow{fill:none;stroke:#49627a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect class="bg" width="1200" height="650" rx="24"/><text class="title" x="600" y="55" text-anchor="middle">Monthly ticket balance normalization</text>
<rect class="blue" x="360" y="90" width="480" height="85"/><text class="label" x="600" y="128" text-anchor="middle">1st day of the month · 00:01</text><text class="small" x="600" y="153" text-anchor="middle">Home Assistant local time</text>
<path class="arrow" d="M600 175v38"/><rect class="box" x="360" y="218" width="480" height="90"/><text class="label" x="600" y="256" text-anchor="middle">Read all four ticket balances</text><text class="small" x="600" y="283" text-anchor="middle">Continue only if every value is valid and within 0–100</text>
<path class="arrow" d="M600 308v38"/><rect class="green" x="360" y="351" width="480" height="95"/><text class="label" x="600" y="390" text-anchor="middle">Subtract the shared minimum</text><text class="small" x="600" y="418" text-anchor="middle">This preserves the differences between balances</text>
<path class="arrow" d="M600 446v35"/><rect class="amber" x="90" y="490" width="470" height="115"/><text class="label" x="325" y="532" text-anchor="middle">Example</text><text class="small" x="325" y="563" text-anchor="middle">3, 4, 3, 4 → subtract 3 → 0, 1, 0, 1</text>
<rect class="box" x="640" y="490" width="470" height="115"/><text class="label" x="875" y="532" text-anchor="middle">No-op / fail safe</text><text class="small" x="875" y="563" text-anchor="middle">Minimum 0: no change · invalid data: no change</text>
</svg>